# Render blueprint — the API and both gates, on the free tier.
#
# This is the no-billing-account path. `deploy/cloudrun.sh` remains the better home for this
# service (a real disk, Litestream replication, no cold starts) and is what to use once a
# billing account exists; nothing here replaces it.
#
# **What the free tier costs you, stated plainly.** No persistent disk and no always-on
# instance. Two consequences, both deliberate rather than overlooked:
#
#  1. The service sleeps after ~15 minutes idle and takes ~50s to wake. The first hit after
#     a quiet spell is slow. Razorpay retries webhooks on non-2xx, so a delivery that lands
#     on a cold instance still arrives.
#  2. `/data` is container-local, so a restart loses reviewer decisions and every precedent
#     the system authored. `PRECEDENT_SEED_ON_EMPTY` reseeds the demo corpus on boot, so the
#     app is always populated and demo-ready — but the corpus does not accumulate across
#     restarts. That is the one claim this project makes, so it matters: set
#     `LITESTREAM_REPLICA_URL` to any S3-compatible bucket and the entrypoint replicates
#     instead, with no image change (see deploy/entrypoint.sh).
#
# Secrets are `sync: false` — Render prompts for them once in the dashboard and never reads
# them from this file, so nothing sensitive is committed.

services:
  - type: web
    name: precedent
    runtime: docker
    plan: free
    region: singapore          # Render's closest free region to India.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz  # Deliberately does not open SQLite — see api/main.py.
    autoDeployTrigger: commit
    envVars:
      - key: PRECEDENT_DB_PATH
        value: /data/precedent.db
      - key: PRECEDENT_SEED_ON_EMPTY
        value: "1"
      # Razorpay's three: the webhook receiver cannot verify a delivery without the webhook
      # secret, and an unverified delivery is not evidence of anything.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Required, not optional: confirming a resolution authors a precedent, so the approval
      # gate calls a model in the request path. Without this the gate refuses every
      # confirmation rather than banking a review with nothing in the corpus behind it.
      - key: NVIDIA_API_KEY
        sync: false
      # Optional, and off unless set. A public URL where one POST spends model credits and
      # writes into a corpus that later cases are resolved from needs something between it
      # and a crawler following forms. Reads stay open; only state changes are gated. Set it
      # in the dashboard, then open /unlock?key=... once in the browser you demo from.
      - key: PRECEDENT_WRITE_KEY
        sync: false
