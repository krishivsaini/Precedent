[project]
name = "precedent"
version = "0.1.0"
description = "An exception-resolution agent whose knowledge base is written by its own operation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "razorpay>=2.0.1",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precedent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
